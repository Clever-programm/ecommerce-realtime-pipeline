# Развёртывание конвейера данных АС «RTP».
# Все сервисы запускаются одной командой: docker compose up -d --build
# Секреты и изменяемые параметры — в файле .env (см. .env.example).

name: rtp

x-pipeline-env: &pipeline-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS}
  KAFKA_TOPIC_LOGS: ${KAFKA_TOPIC_LOGS}
  POSTGRES_DWH_HOST: ${POSTGRES_DWH_HOST}
  POSTGRES_DWH_PORT: ${POSTGRES_DWH_PORT}
  POSTGRES_DWH_DB: ${POSTGRES_DWH_DB}
  POSTGRES_DWH_USER: ${POSTGRES_DWH_USER}
  POSTGRES_DWH_PASSWORD: ${POSTGRES_DWH_PASSWORD}
  EXTERNAL_API_URL: ${EXTERNAL_API_URL}
  EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
  MINIO_BUCKET_STAGING: ${MINIO_BUCKET_STAGING}
  PIPELINE_CONFIG: /opt/pipeline/config/pipeline.yaml

networks:
  rtp-net:
    driver: bridge

volumes:
  kafka_data:
  pg_dwh_data:
  pg_ext_data:
  airflow_db_data:
  clickhouse_data:
  minio_data:
  spark_checkpoints:
  nginx_logs:
  grafana_data:
  prometheus_data:

services:
  # ─── Брокер сообщений (приём и буферизация потока) ──────────
  kafka:
    image: docker.m.daocloud.io/apache/kafka:3.9.0
    container_name: rtp-kafka
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 суток — требование надёжности
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      CLUSTER_ID: NGIyNTVkNDQ4YzUxNDNkZm
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: docker.m.daocloud.io/apache/kafka:3.9.0
    container_name: rtp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks: [rtp-net]
    entrypoint: >
      /bin/sh -c "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic ${KAFKA_TOPIC_EVENTS}
      --partitions 3 --replication-factor 1
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic ${KAFKA_TOPIC_LOGS}
      --partitions 3 --replication-factor 1
      && echo 'topics ready'"

  # ─── Хранилище витрин (локальная реляционная СУБД) ──────────
  postgres-dwh:
    image: postgres:16-alpine
    container_name: rtp-postgres-dwh
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${POSTGRES_DWH_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DWH_DB}
      POSTGRES_USER: ${POSTGRES_DWH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DWH_PASSWORD}
    volumes:
      - pg_dwh_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DWH_USER} -d ${POSTGRES_DWH_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── Внешний источник: БД с подготовленными событиями ───────
  postgres-external:
    image: postgres:16-alpine
    container_name: rtp-postgres-external
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${POSTGRES_EXT_EXTERNAL_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_EXT_DB}
      POSTGRES_USER: ${POSTGRES_EXT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_EXT_PASSWORD}
    volumes:
      - pg_ext_data:/var/lib/postgresql/data
      - ./db/external:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EXT_USER} -d ${POSTGRES_EXT_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Программный интерфейс доступа к внешнему источнику.
  # Прямое подключение конвейера к внешней БД не предусмотрено.
  external-api:
    build: ./docker/api
    container_name: rtp-external-api
    restart: unless-stopped
    depends_on:
      postgres-external:
        condition: service_healthy
    networks: [rtp-net]
    environment:
      POSTGRES_EXT_HOST: postgres-external
      POSTGRES_EXT_PORT: 5432
      POSTGRES_EXT_DB: ${POSTGRES_EXT_DB}
      POSTGRES_EXT_USER: ${POSTGRES_EXT_USER}
      POSTGRES_EXT_PASSWORD: ${POSTGRES_EXT_PASSWORD}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # ─── Аналитическая СУБД (потоковые витрины) ─────────────────
  clickhouse:
    image: docker.m.daocloud.io/clickhouse/clickhouse-server:25.3
    container_name: rtp-clickhouse
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${CLICKHOUSE_EXTERNAL_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── Озеро данных (S3-совместимое хранилище) ────────────────
  minio:
    image: pgsty/minio:latest
    container_name: rtp-minio
    restart: unless-stopped
    networks: [rtp-net]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ─── Потоковая обработка (PySpark Structured Streaming) ─────
  spark-streaming:
    build: ./docker/spark
    container_name: rtp-spark-streaming
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [rtp-net]
    environment:
      <<: *pipeline-env
    volumes:
      - ./src:/opt/pipeline/src:ro
      - ./config:/opt/pipeline/config:ro
      - spark_checkpoints:/opt/spark-checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --conf spark.driver.memory=1536m
      --conf spark.sql.shuffle.partitions=6
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      /opt/pipeline/src/transform/streaming_job.py
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f spark-submit >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Источники (эмуляция фронтенда и веб-сервера) ───────────
  events-generator:
    build: ./docker/pipeline
    container_name: rtp-events-generator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [rtp-net]
    environment:
      <<: *pipeline-env
      GENERATOR_RATE_PER_SEC: ${GENERATOR_RATE_PER_SEC:-20}
    volumes:
      - ./src:/opt/pipeline/src:ro
      - ./config:/opt/pipeline/config:ro
      - nginx_logs:/var/log/nginx
    command: ["python", "/opt/pipeline/src/extract/events_generator.py"]

  # ─── Извлечение журналов веб-сервера ────────────────────────
  # Читает файлы combined log из общего тома и публикует записи в Kafka.
  log-shipper:
    build: ./docker/pipeline
    container_name: rtp-log-shipper
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [rtp-net]
    environment:
      <<: *pipeline-env
    volumes:
      - ./src:/opt/pipeline/src:ro
      - ./config:/opt/pipeline/config:ro
      - nginx_logs:/var/log/nginx:ro
    command: ["python", "/opt/pipeline/src/extract/log_shipper.py"]

  # ─── Оркестратор пакетных задач ──────────────────────────────
  airflow-db:
    image: postgres:16-alpine
    container_name: rtp-airflow-db
    restart: unless-stopped
    networks: [rtp-net]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_secret
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  airflow-init:
    build: ./docker/airflow
    container_name: rtp-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    networks: [rtp-net]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_secret@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    entrypoint: /bin/bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --role Admin --email admin@example.org || true"

  airflow-webserver:
    build: ./docker/airflow
    container_name: rtp-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [rtp-net]
    ports:
      - "${AIRFLOW_EXTERNAL_PORT:-8080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_secret@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_ADMIN_PASSWORD}
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    build: ./docker/airflow
    container_name: rtp-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-dwh:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [rtp-net]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_secret@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_ADMIN_PASSWORD}
      <<: *pipeline-env
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/pipeline/src:ro
      - ./config:/opt/pipeline/config:ro
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --allow-multiple --limit 100 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Мониторинг и логирование ────────────────────────────────
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.54.1
    container_name: rtp-prometheus
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.2.0
    container_name: rtp-grafana
    restart: unless-stopped
    networks: [rtp-net]
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - clickhouse
